[package]
name = "binform-tools"
version = "0.0.0"
edition = "2024"
publish = false
description = "Command-line tools for binform: dump a function table, compare with rizin"

[dependencies]
binform = { path = ".." }
# Only for `binform-ab goblin`, the A/B against filefacts' former parser.
# This crate is unpublished, so binform's dependents never see goblin.
goblin = { version = "0.10", default-features = false, features = ["std", "pe32", "pe64", "elf32", "elf64", "endian_fd", "mach32", "mach64"] }
serde_json = "1"
zstd = "0.13"

