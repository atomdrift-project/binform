[package]
name = "binform"
version = "0.1.0"
edition = "2024"
# Build on any rustc within ~2 releases of current stable; edition 2024 implies
# the MSRV-aware resolver, so this also caps dependency versions.
rust-version = "1.94"
authors = ["The Atomdrift Project"]
description = "Function boundaries, basic blocks, complexity and call edges recovered from machine code"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/atomdrift-project/binform"
keywords = ["binary", "disassembly", "cfg", "reverse-engineering", "malware"]
categories = ["development-tools", "parser-implementations"]
exclude = ["testdata/", "tools/", "fuzz/", "docs/", ".github/"]

[workspace]
members = [".", "tools"]
exclude = ["fuzz"]

[dependencies]
iced-x86 = { version = "1.22", default-features = false, features = ["decoder", "std", "instr_info"] }
gimli = { version = "0.32", default-features = false, features = ["read", "std"] }

[features]
# Per-function recovery diagnostics, for inspecting recovery: not part of
# the stable API.
diagnostics = []

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
zstd = "0.13"
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
# Input is hostile: no panicking accessors or arithmetic in library code.
indexing_slicing = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
cast_possible_truncation = "warn"
arithmetic_side_effects = "warn"

[profile.test]
opt-level = 2
